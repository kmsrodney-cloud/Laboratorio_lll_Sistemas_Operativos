
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Almirante TSM64 | Landing Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #ffffff10;
      border: 1px solid #ffffff25;
      border-radius: 20px;
      padding: 50px 40px;
      max-width: 700px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 15px;
      color: #38bdf8;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.7;
      margin-bottom: 30px;
      color: #e2e8f0;
    }

    .icon {
      font-size: 70px;
      margin-bottom: 20px;
    }

    .button {
      display: inline-block;
      background: #38bdf8;
      color: #0f172a;
      padding: 15px 35px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .button:hover {
      background: #0ea5e9;
      transform: scale(1.05);
    }

    footer {
      margin-top: 35px;
      font-size: 0.9rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">🚀</div>

    <h1>Almirante TSM64</h1>

    <p>
      Bienvenido a mi landing page personal. Esta página fue desplegada
      utilizando un contenedor Docker con Nginx, demostrando cómo servir
      contenido web estático desde un entorno containerizado.
    </p>

    <a class="button" href="https://github.com/">Ver mi portafolio</a>

    <footer>
      Laboratorio de Docker y Nginx — 2026
    </footer>
  </main>
</body>
</html>
